<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#101318"><title>ZOMBO — Выживание</title><script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{color-scheme:dark;--bg:#101318;--panel:#1a2028;--line:#303944;--muted:#9aa7b5;--red:#e35d55;--green:#65c18c;--gold:#e9b85e}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#222b34 0,#101318 60%);color:#edf2f5;font:15px system-ui,-apple-system,sans-serif;padding:16px 14px 88px;max-width:680px;margin:auto}.top{display:flex;justify-content:space-between;align-items:center}.logo{font-weight:1000;letter-spacing:5px;font-size:23px}.tag{color:var(--red);font-size:10px;letter-spacing:2px}.panel{background:linear-gradient(145deg,#202832,#171c23);border:1px solid var(--line);border-radius:17px;padding:15px;margin-top:13px;box-shadow:0 8px 28px #0002}.eyebrow{color:var(--muted);font-size:11px;letter-spacing:1.5px;text-transform:uppercase}.hero{background:linear-gradient(130deg,#3b2425,#1c242c 65%);min-height:140px;position:relative;overflow:hidden}.hero:after{content:'☣';position:absolute;right:14px;top:0;font-size:100px;color:#e35d5520}.hero h1{font-size:25px;margin:8px 0}.muted{color:var(--muted)}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:#11161c;border-radius:12px;padding:11px}.stat b{display:block;font-size:19px;margin-top:4px}.bar{height:6px;background:#343b44;border-radius:9px;overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;background:var(--green);width:75%}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.tile{background:#141a20;border:1px solid var(--line);padding:13px;border-radius:13px;min-height:86px;text-align:left;color:inherit}.tile .emoji{font-size:24px}.tile b{display:block;margin-top:7px}.btn{border:0;background:var(--red);color:white;font-weight:800;border-radius:12px;padding:13px 14px;width:100%;font-size:15px;margin-top:9px}.btn.secondary{background:#303944}.btn.gold{background:#6c5226;color:#ffe4a6}.nav{position:fixed;bottom:0;left:0;right:0;background:#11161cf2;border-top:1px solid var(--line);display:flex;justify-content:center;gap:0;padding:8px max(5px,env(safe-area-inset-right)) calc(8px + env(safe-area-inset-bottom));backdrop-filter:blur(16px)}.nav button{flex:1;max-width:120px;border:0;background:transparent;color:#aab5c0;padding:6px 2px;font-size:11px}.nav button span{display:block;font-size:20px;margin-bottom:3px}.nav button.active{color:#ff9a87}.row{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:11px 0;border-bottom:1px solid #303944}.row:last-child{border-bottom:0}.badge{border:1px solid #53616d;border-radius:8px;padding:4px 7px;color:var(--gold);font-size:11px}.enemy{font-size:70px;text-align:center;padding:10px}.hidden{display:none}.notice{font-size:12px;color:var(--muted);line-height:1.5}.toast{margin-top:10px;color:var(--green);font-size:12px}
/* ZOMBO field UI polish */
body{padding-top:calc(14px + env(safe-area-inset-top));background:radial-gradient(ellipse at 85% -5%,#4b2928 0,transparent 38%),radial-gradient(ellipse at 0 30%,#1e3033 0,transparent 42%),#0b0f13}
.panel{box-shadow:0 12px 32px #0003,inset 0 1px #ffffff08;backdrop-filter:blur(8px)}
.hero{border-color:#69413d;background:linear-gradient(120deg,#402626,#202830 75%)}
.logo{font-size:25px;text-shadow:0 0 24px #e35d5555}.tag{font-weight:800}
.btn,.tile,.nav button{cursor:pointer;transition:transform .12s ease,filter .12s ease}.btn:active,.tile:active{transform:scale(.98);filter:brightness(1.12)}
.tile{background:linear-gradient(145deg,#1a2229,#12171d)}.bar i{transition:width .25s ease}
.mission{padding:12px;border:1px solid var(--line);background:#11171d;border-radius:12px;margin-top:9px}.mission-head{display:flex;align-items:center;gap:10px}.mission-icon{font-size:24px}.mission p{margin:6px 0;color:var(--muted);font-size:12px}.mini-progress{height:4px;background:#303944;border-radius:5px;margin-top:8px;overflow:hidden}.mini-progress i{display:block;height:100%;background:var(--green)}.pill{display:inline-block;background:#26362e;color:#9be0b3;border-radius:7px;padding:4px 7px;font-size:10px;font-weight:800}.shop-item{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}.shop-item:last-child{border-bottom:0}.shop-item .desc{flex:1}.shop-item small{color:var(--muted)}.buy{background:#6c5226;color:#ffe4a6;border:0;border-radius:9px;padding:9px 11px;font-weight:800}
</style></head><body>
<header class="top"><div><div class="logo">ZOMBO</div><div class="tag">SURVIVE THE OUTBREAK</div></div><div class="badge">☣ ЗОНА 01</div></header>
<main id="app"></main><div id="server-status" style="max-width:680px;margin:0 auto;padding:0 14px 12px;color:#9aa7b5;font-size:11px">Подключение к игровому серверу…</div><nav class="nav"><button data-page="home" class="active"><span>⌂</span>База</button><button data-page="hero"><span>♟</span>Персонаж</button><button data-page="bag"><span>▦</span>Инвентарь</button><button data-page="raid"><span>☣</span>Вылазка</button><button data-page="missions"><span>☷</span>Задания</button><button data-page="shop"><span>⚒</span>Торговец</button></nav>
<script>
const tg=window.Telegram?.WebApp;try{tg?.ready();tg?.expand();tg?.setHeaderColor('#101318');tg?.setBackgroundColor('#101318')}catch(e){}
const defaults={page:'home',hp:100,maxHp:100,stamina:80,coins:500,xp:0,level:1,medkits:0,ammo:0,enemyHp:55,combat:false,log:'Ты добрался до убежища. Снаружи слышны шаги.',scavenges:0,missionsClaimed:[],nickname:'Выживший',playerClass:'pending',zombo:0,hunger:100,thirst:100,registered:0,realInventory:[],strength:0,agility:0,endurance:0,accuracy:0,regen:0,luck:0};
let state;try{state={...defaults,...JSON.parse(localStorage.getItem('zombo_demo_save')||'{}'),page:'home'}}catch(e){state={...defaults}}
function save(){try{localStorage.setItem('zombo_demo_save',JSON.stringify(state))}catch(e){}}
const app=document.querySelector('#app');const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function stats(){return `<div class="stats"><div class="stat"><span class="eyebrow">Здоровье</span><b>❤ ${state.hp}/${state.maxHp}</b><div class="bar"><i style="width:${state.hp/state.maxHp*100}%;background:var(--red)"></i></div></div><div class="stat"><span class="eyebrow">Энергия</span><b>⚡ ${state.stamina}/100</b><div class="bar"><i style="width:${state.stamina}%;background:var(--gold)"></i></div></div><div class="stat"><span class="eyebrow">Крышки</span><b>🪙 ${state.coins}</b></div></div>`}
function home(){return `<section class="panel hero"><div class="eyebrow">Убежище · День 01</div><h1>Добро пожаловать,<br>выживший.</h1><div class="muted">Мир пал. Твоя история — нет.</div></section><section class="panel">${stats()}</section><section class="panel"><div class="eyebrow">Быстрый доступ</div><div class="grid" style="margin-top:10px"><button class="tile" onclick="go('hero')"><span class="emoji">♟</span><b>Персонаж</b><small class="muted">Ур. ${state.level} · Выживший</small></button><button class="tile" onclick="go('bag')"><span class="emoji">🎒</span><b>Инвентарь</b><small class="muted">${state.medkits+state.ammo} предметов</small></button><button class="tile" onclick="go('raid')"><span class="emoji">☣️</span><b>Вылазка</b><small class="muted">Заражённый квартал</small></button><button class="tile" onclick="rest()"><span class="emoji">🛏️</span><b>Передохнуть</b><small class="muted">Восстановить энергию</small></button></div></section><section class="panel"><div class="eyebrow">Сводка убежища</div><div class="row"><span>📡 Сигнал неизвестного</span><span class="badge">Новое</span></div><div class="row"><span>🎯 Первая вылазка</span><span class="muted">Не завершена</span></div><div class="notice">Профиль, характеристики и инвентарь загружаются из настоящей базы ZOMBO. Боевые и торговые действия пока не изменяют серверную базу.</div></section>`}
function hero(){return `<section class="panel hero"><div class="eyebrow">Досье выжившего</div><h1>${esc(state.nickname||'Выживший')}</h1><div class="muted">Уровень ${state.level} · Класс: ${esc(state.playerClass||'pending')}</div></section><section class="panel">${stats()}<div class="row"><span>⚔️ Сила</span><b>${state.strength}</b></div><div class="row"><span>🏃 Ловкость</span><b>${state.agility}</b></div><div class="row"><span>🛡️ Выносливость</span><b>${state.endurance}</b></div><div class="row"><span>🎯 Меткость</span><b>${state.accuracy}</b></div><div class="row"><span>⭐ Опыт</span><b>${state.xp}/100</b></div><button class="btn secondary" onclick="toast('Прокачка откроется после подключения игровой базы')">Навыки и улучшения</button></section>`}
function bag(){const rows=state.realInventory.length?state.realInventory.map(it=>`<div class="row"><span>📦 ${esc(it.item_id)}</span><b>×${Number(it.amount)||0}</b></div>`).join(''):'<p class="muted">Инвентарь пуст.</p>';return `<section class="panel"><div class="eyebrow">Снаряжение из базы данных</div><h1>Инвентарь</h1>${rows}<div class="row"><span>🪙 Крышки</span><b>${state.coins}</b></div><p class="notice">Это реальные предметы из профиля SQLite. Изменение предметов через Mini App будет подключено отдельными защищёнными игровыми действиями.</p></section>`}
function raid(){return `<section class="panel hero"><div class="eyebrow">Опасная зона · Уровень угрозы 1</div><h1>Заражённый квартал</h1><div class="muted">Обшарь руины. Не шуми.</div></section><section class="panel"><div class="eyebrow">Цель обнаружена</div><div class="enemy">🧟</div><h2 style="text-align:center;margin:0">Бродячий заражённый</h2><p class="muted" style="text-align:center">${state.combat?`Здоровье врага: ${state.enemyHp}/55`:'Враг пока не заметил тебя.'}</p>${state.combat?`<div class="bar"><i style="width:${state.enemyHp/55*100}%;background:var(--red)"></i></div><button class="btn" onclick="attack()">⚔️ Атаковать · 1 патрон</button><button class="btn secondary" onclick="flee()">Отступить</button>`:`<button class="btn" onclick="startFight()">Начать бой</button><button class="btn secondary" onclick="scavenge()">🎒 Обшарить руины · 10 энергии</button>`}<div id="toast" class="toast">${esc(state.log)}</div></section><section class="panel"><div class="eyebrow">Награда за победу</div><div class="row"><span>🪙 Крышки</span><b>+50–90</b></div><div class="row"><span>⭐ Опыт</span><b>+25</b></div></section>`}
function missions(){const list=[{id:'first',icon:'☣️',name:'Первый контакт',desc:'Победи заражённого в вылазке.',reward:'🪙 80 · ⭐ 30',done:state.scavenges>0},{id:'scavenge',icon:'🎒',name:'Сборщик руин',desc:'Обыщи заброшенный квартал 3 раза.',reward:'🪙 120 · 🩹 1',done:state.scavenges>=3}];return `<section class="panel hero"><div class="eyebrow">Доска убежища</div><h1>Задания</h1><div class="muted">Каждый выход за стены приближает нас к спасению.</div></section><section class="panel"><div class="eyebrow">Активные поручения</div>${list.map(m=>`<div class="mission"><div class="mission-head"><span class="mission-icon">${m.icon}</span><div style="flex:1"><b>${m.name}</b><div class="muted" style="font-size:11px">${m.reward}</div></div>${m.done?(state.missionsClaimed.includes(m.id)?'<span class="pill">Получено</span>':`<button class="buy" onclick="claim('${m.id}')">Забрать</button>`):'<span class="badge">В процессе</span>'}</div><p>${m.desc}</p><div class="mini-progress"><i style="width:${m.id==='first'?(m.done?100:0):Math.min(100,state.scavenges/3*100)}%"></i></div></div>`).join('')}</section><section class="panel"><div class="eyebrow">Разведка</div><p class="notice">Снаряжение не бесконечно. Подготовь аптечки и патроны перед выходом.</p><button class="btn" onclick="go('raid')">Отправиться в вылазку</button></section>`}
function shop(){return `<section class="panel hero"><div class="eyebrow">Убежище · торговый пост</div><h1>Старьёвщик</h1><div class="muted">«Монеты вперёд. Вопросы потом»</div></section><section class="panel"><div class="row"><span>Твои крышки</span><b>🪙 ${state.coins}</b></div><div class="shop-item"><span style="font-size:28px">🩹</span><div class="desc"><b>Аптечка</b><br><small>Восстанавливает до 35 HP</small><br><span class="badge">75 крышек</span></div><button class="buy" onclick="buy('medkit')">Купить</button></div><div class="shop-item"><span style="font-size:28px">🔩</span><div class="desc"><b>Патроны ×5</b><br><small>Для боя с заражёнными</small><br><span class="badge">45 крышек</span></div><button class="buy" onclick="buy('ammo')">Купить</button></div><div class="shop-item"><span style="font-size:28px">🥫</span><div class="desc"><b>Полевой паёк</b><br><small>Восстанавливает 20 энергии</small><br><span class="badge">30 крышек</span></div><button class="buy" onclick="buy('food')">Купить</button></div><div id="toast" class="toast"></div></section>`}
function claim(id){if(state.missionsClaimed.includes(id))return;const valid=id==='first'?state.scavenges>0:state.scavenges>=3;if(!valid){toast('Задание ещё не выполнено');return}state.missionsClaimed.push(id);state.coins+=id==='first'?80:120;if(id==='scavenge')state.medkits++;state.log='Награда за задание получена!';render()}
function buy(item){const prices={medkit:75,ammo:45,food:30};if(state.coins<prices[item]){toast('Не хватает крышек');return}state.coins-=prices[item];if(item==='medkit')state.medkits++;if(item==='ammo')state.ammo+=5;if(item==='food')state.stamina=Math.min(100,state.stamina+20);render()}
function scavenge(){if(state.stamina<10){state.log='Не хватает энергии для поиска.';render();return}state.stamina-=10;state.scavenges++;const roll=Math.random();if(roll<.45){state.coins+=25;state.log='Нашёл тайник: +25 крышек.'}else if(roll<.7){state.ammo+=2;state.log='Нашёл 2 патрона в старом ящике.'}else if(roll<.85){state.medkits++;state.log='В развалинах нашлась аптечка.'}else{state.hp=Math.max(1,state.hp-8);state.log='Засада! Ты потерял 8 HP, но смог уйти.'}render()}
function render(){app.innerHTML=({home,hero,bag,raid,missions,shop})[state.page]();document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===state.page));save();}
function go(p){state.page=p;render()}function toast(t){const el=document.querySelector('#toast');if(el)el.textContent=t;else alert(t)}function rest(){state.stamina=Math.min(100,state.stamina+20);state.hp=Math.min(state.maxHp,state.hp+5);render()}function useMedkit(){if(state.medkits<1){toast('Аптечек больше нет');return}if(state.hp===state.maxHp){toast('Здоровье уже полное');return}state.medkits--;state.hp=Math.min(state.maxHp,state.hp+35);render()}function startFight(){if(state.stamina<5){state.log='Недостаточно энергии. Отдохни на базе.';render();return}state.stamina-=5;state.enemyHp=55;state.combat=true;state.log='Заражённый приближается!';render()}function attack(){if(!state.combat)return;if(state.ammo<1){state.log='Нет патронов! Отступи или найди боеприпасы.';render();return}state.ammo--;state.enemyHp=Math.max(0,state.enemyHp-18);if(state.enemyHp===0){state.combat=false;state.coins+=65;state.xp+=25;state.log='Победа! +65 крышек, +25 опыта.';if(state.xp>=100){state.level++;state.xp-=100;state.maxHp+=10;state.hp=state.maxHp;state.log+=' Новый уровень!'}render();return}state.hp=Math.max(0,state.hp-12);if(state.hp===0){state.hp=1;state.combat=false;state.log='Ты едва спасся и отступил. Восстановись на базе.'}else state.log='Ты нанёс 18 урона. Заражённый атаковал в ответ!';render()}function flee(){state.combat=false;state.log='Ты отступил обратно к безопасной зоне.';render()}
document.querySelectorAll('.nav button').forEach(b=>b.addEventListener('click',()=>go(b.dataset.page)));
if(tg?.initDataUnsafe?.user?.first_name){const h=document.querySelector('.hero h1');if(h&&state.page==='home')h.innerHTML='Добро пожаловать,<br>'+esc(tg.initDataUnsafe.user.first_name)+'.'}render();

// Live character data: authenticated with Telegram WebApp initData (never trust initDataUnsafe for server auth).
const API_BASE=(document.querySelector('meta[name="zombo-api-url"]')?.content||window.ZOMBO_API_URL||location.origin).replace(/\/$/,'');
async function loadRealCharacter(){const status=document.querySelector('#server-status');if(!tg?.initData){status.textContent='Открой игру кнопкой из Telegram-бота: авторизация Mini App недоступна в обычном браузере.';return}try{const r=await fetch(API_BASE+'/api/me',{headers:{'X-Telegram-Init-Data':tg.initData},cache:'no-store'});const data=await r.json();if(!r.ok)throw new Error(data.message||data.error||'API error');const p=data.player||{},st=data.stats||{};state.hp=Number(p.hp??100);state.maxHp=Number(p.max_hp??100);state.stamina=Number(p.stamina??0);state.coins=Number(p.coins??0);state.xp=Number(p.xp??0);state.level=Number(p.level??1);state.zombo=Number(p.zombo??0);state.hunger=Number(p.hunger??100);state.thirst=Number(p.thirst??100);state.nickname=p.nickname||p.username||'Выживший';state.playerClass=p.class||'pending';state.registered=Number(p.registered??0);state.strength=Number(st.strength??0);state.agility=Number(st.agility??0);state.endurance=Number(st.endurance??0);state.accuracy=Number(st.accuracy??0);state.regen=Number(st.regen??0);state.luck=Number(st.luck??0);state.realInventory=data.inventory||[];state.medkits=state.realInventory.filter(x=>/medkit|bandage/i.test(x.item_id)).reduce((a,x)=>a+Number(x.amount||0),0);state.ammo=state.realInventory.filter(x=>/ammo/i.test(x.item_id)).reduce((a,x)=>a+Number(x.amount||0),0);render();status.textContent='● Персонаж синхронизирован с серверной БД ZOMBO';status.style.color='#65c18c'}catch(e){status.textContent='Нет связи с игровым API: '+e.message+'. Проверь публичный адрес API и открой игру через Telegram.';status.style.color='#e9b85e'}}
loadRealCharacter();
</script></body></html>
